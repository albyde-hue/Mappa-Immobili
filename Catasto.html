<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mappa Catastale - IGEA</title>
    <!-- CSS di Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .info-box {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7); color: white; padding: 10px 20px;
            border-radius: 8px; z-index: 1000; font-size: 14px; text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div class="info-box" id="infoBox">Caricamento particelle catastali...</div>

    <!-- Script di Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Lettura dei parametri avanzati passati da AppSheet
        const urlParams = new URLSearchParams(window.location.search);
        
        let lat = urlParams.has('lat') ? parseFloat(urlParams.get('lat')) : 41.890251;
        let lng = urlParams.has('lng') ? parseFloat(urlParams.get('lng')) : 12.492373;
        let zoom = urlParams.has('zoom') ? parseInt(urlParams.get('zoom')) : 18;
        
        let idImmobile = urlParams.get('id') || 'Non specificato';
        let comune = urlParams.get('comune') || '';
        let localita = urlParams.get('localita') || '';

        // 2. Inizializzazione della mappa
        const map = L.map('map').setView([lat, lng], zoom);

        // 3. Aggiunta livello Satellitare con trucco per over-zoom (evita sfondo grigio a zoom alti)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxNativeZoom: 19, // Oltre il 19, usa le immagini del 19 ingrandendole
            maxZoom: 22
        }).addTo(map);

        // 4. Aggiunta WMS Agenzia delle Entrate (Poligoni Catastali)
        const catastoAdE = L.tileLayer.wms('https://wms.cartografia.agenziaentrate.gov.it/inspire/wms/ows01.php', {
            layers: 'CP.CadastralZoning,CP.CadastralParcel,fabbricati,strade,acque', 
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            attribution: '&copy; Agenzia delle Entrate',
            maxZoom: 22
        }).addTo(map);

        // 5. Creazione del testo per il Popup (usa i dati di AppSheet)
        let popupText = `<b>ID Immobile: ${idImmobile}</b>`;
        if (comune !== '') popupText += `<br>Comune: ${comune}`;
        if (localita !== '') popupText += `<br>Località: ${localita}`;

        // 6. Aggiunta del Pin (Marker)
        const marker = L.marker([lat, lng]).addTo(map)
            .bindPopup(popupText)
            .openPopup();

        // Nascondi l'avviso di caricamento dopo pochi secondi
        setTimeout(() => {
            document.getElementById('infoBox').style.display = 'none';
        }, 4000);
    </script>
</body>
</html>
