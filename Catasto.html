<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mappa Catastale - IGEA</title>
    <!-- CSS di Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .info-box {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7); color: white; padding: 10px 20px;
            border-radius: 8px; z-index: 1000; font-size: 14px; text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <!-- Box informativo a comparsa -->
    <div class="info-box" id="infoBox">Caricamento particelle catastali...</div>

    <!-- Script di Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Lettura delle coordinate dall'URL
        // Supporta sia ?q=lat,lng sia ?lat=x&lng=y
        const urlParams = new URLSearchParams(window.location.search);
        const qParam = urlParams.get('q');
        let lat = 41.890251; // Coordinate di default (Roma)
        let lng = 12.492373;

        if (qParam) {
            const parts = qParam.split(',');
            if (parts.length === 2) {
                lat = parseFloat(parts[0].trim());
                lng = parseFloat(parts[1].trim());
            }
        } else if (urlParams.has('lat') && urlParams.has('lng')) {
            lat = parseFloat(urlParams.get('lat'));
            lng = parseFloat(urlParams.get('lng'));
        }

        // 2. Inizializzazione della mappa
        // IMPORTANTE: Il WMS dell'Agenzia delle Entrate mostra le particelle solo a zoom alti (>= 18)
        const map = L.map('map').setView([lat, lng], 18);

        // 3. Aggiunta livello Satellitare (Base)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
            maxZoom: 20
        }).addTo(map);

        // 4. Aggiunta WMS Agenzia delle Entrate (Poligoni Catastali)
        const catastoAdE = L.tileLayer.wms('https://wms.cartografia.agenziaentrate.gov.it/inspire/wms/ows01.php', {
            layers: 'CP.CadastralZoning,CP.CadastralParcel,fabbricati,strade,acque', 
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            attribution: '&copy; <a href="https://www.agenziaentrate.gov.it/" target="_blank">Agenzia delle Entrate</a>',
            maxZoom: 20
        });
        catastoAdE.addTo(map);

        // 5. Aggiunta del Pin (Marker) sulla coordinata esatta
        const marker = L.marker([lat, lng]).addTo(map)
            .bindPopup('<b>Immobile IGEA</b><br>Posizione esatta')
            .openPopup();

        // Rimuovi il box informativo dopo 4 secondi
        setTimeout(() => {
            document.getElementById('infoBox').style.display = 'none';
        }, 4000);
    </script>
</body>
</html>
