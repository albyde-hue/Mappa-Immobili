<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mappa Catastale - IGEA</title>
    <!-- CSS di Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .info-box {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7); color: white; padding: 10px 20px;
            border-radius: 8px; z-index: 1000; font-size: 14px; text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div class="info-box" id="infoBox">Caricamento Mappa Catastale...</div>

    <!-- Script di Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Lettura delle coordinate dall'URL
        const urlParams = new URLSearchParams(window.location.search);
        let lat = urlParams.has('lat') ? parseFloat(urlParams.get('lat')) : 41.890251;
        let lng = urlParams.has('lng') ? parseFloat(urlParams.get('lng')) : 12.492373;
        
        let idImmobile = urlParams.get('id') || 'Non specificato';
        let comune = urlParams.get('comune') || '';

        // 2. Inizializzazione della mappa
        // FORZIAMO LO ZOOM A 19 PER GARANTIRE LA VISUALE DEL CATASTO
        const map = L.map('map').setView([lat, lng], 19);

        // 3. Aggiunta livello Satellitare (con maxNativeZoom a 19 per evitare sfondi grigi)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxNativeZoom: 19,
            maxZoom: 22
        }).addTo(map);

        // 4. Aggiunta WMS Agenzia delle Entrate (Poligoni Catastali)
        const catastoAdE = L.tileLayer.wms('https://wms.cartografia.agenziaentrate.gov.it/inspire/wms/ows01.php', {
            layers: 'CP.CadastralParcel,fabbricati', // Abbiamo lasciato solo terreni e fabbricati
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            uppercase: true, // Questo aiuta i server AdE a rispondere correttamente
            attribution: '&copy; Agenzia delle Entrate',
            minZoom: 18, // Sotto il 18 il catasto sparisce
            maxZoom: 22
        }).addTo(map);

        // 5. Creazione del Pin
        let popupText = `<b>ID Immobile: ${idImmobile}</b><br>Comune: ${comune}`;
        const marker = L.marker([lat, lng]).addTo(map).bindPopup(popupText).openPopup();

        // Nascondi avviso
        setTimeout(() => { document.getElementById('infoBox').style.display = 'none'; }, 3000);
    </script>
</body>
</html>
