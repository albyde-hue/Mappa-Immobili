<!DOCTYPE html>
<html>
<head>
    <title>Consultazione Mappa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
      body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
      
      .map-container { position: relative; height: 100vh; width: 100vw; }
      
      .map-iframe { 
        height: 100%; width: 100%; border: none; 
        pointer-events: none; /* Blocca il touch sulla mappa */
        margin-top: 60px; /* Spazio per la testata */
        height: calc(100% - 60px); /* Altezza totale meno testata */
      }
      
      /* Vetro protettivo per bloccare il touch */
      .glass-pane { 
        position: absolute; top: 60px; left: 0; 
        width: 100%; height: calc(100% - 60px); z-index: 10; 
        background: rgba(255, 255, 255, 0); 
      }

      /* Pin Rosso centrale */
      .center-pin {
        position: absolute; top: calc(50% + 30px); /* Centro mappa correttto per l'header */
        left: 50%;
        transform: translate(-50%, -100%);
        z-index: 20; width: 35px; height: 35px;
        pointer-events: none;
        filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.3));
      }

      /* --- NUOVA TESTATA (HEADER) --- */
      .custom-header {
        position: absolute; top: 0; left: 0; width: 100%; height: 60px;
        background-color: #2c3e50; /* Colore scuro professionale */
        color: white; z-index: 100; /* Sopra a tutto */
        display: flex; justify-content: space-between; align-items: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        box-sizing: border-box; padding: 0 15px;
      }

      .header-info {
        display: flex; flex-direction: column;
        max-width: 70%; /* Evita sovrapposizioni su schermi piccoli */
      }

      .info-id { font-size: 12px; opacity: 0.8; font-weight: bold; }
      .info-comune { font-size: 18px; font-weight: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .close-btn {
        background-color: #e74c3c; /* Rosso visibile */
        color: white; border: none; padding: 8px 16px;
        border-radius: 4px; font-weight: bold; cursor: pointer;
        font-size: 14px; text-transform: uppercase;
        transition: background-color 0.2s;
        pointer-events: auto; /* IMPORTANTE: Questo pulsante deve essere cliccabile */
      }

      .close-btn:hover { background-color: #c0392b; }
      .close-btn:active { transform: translateY(1px); }

    </style>
</head>
<body>
    <div class="map-container">
      
      <!-- Testata Personalizzata -->
      <div class="custom-header">
        <div class="header-info">
          <span class="info-id" id="displayId">ID: N/D</span>
          <span class="info-comune" id="displayComune">Comune non specificato</span>
        </div>
        <button class="close-btn" id="closeButton">CHIUDI</button>
      </div>

      <!-- Vetro protettivo -->
      <div class="glass-pane"></div>
      
      <!-- Pin SVG -->
      <div class="center-pin">
        <svg viewBox="0 0 24 24" fill="#DB4437" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
      </div>
      
      <!-- Iframe della Mappa -->
      <iframe id="googleMap" class="map-iframe" src=""></iframe>

    </div>

    <script>
        // 1. Legge TUTTI i parametri dall'URL (coordinate + info immobile)
        const urlParams = new URLSearchParams(window.location.search);
        const lat = urlParams.get('lat') || '39.511889';
        const lng = urlParams.get('lng') || '8.547901';
        const idVal = urlParams.get('id') || 'N/D';
        const comuneVal = urlParams.get('comune') || 'N/D';

        // 2. Costruisce la Google Maps
        const myMapsId = "1lQVisgwxED-JnABZDTxeDWWy5c52AdA";
        const mapUrl = `https://www.google.com/maps/d/embed?mid=${myMapsId}&ll=${lat},${lng}&z=18`;
        document.getElementById('googleMap').src = mapUrl;

        // 3. Aggiorna la testata con l'ID e il Comune
        document.getElementById('displayId').innerText = `ID: ${idVal}`;
        document.getElementById('displayComune').innerText = comuneVal;

        // 4. Gestisce il pulsante CHIUDI
        document.getElementById('closeButton').onclick = function() {
          // window.history.back() è il metodo più sicuro per "tornare indietro" ad AppSheet
          // funzionando come il tasto 'Indietro' del browser/telefono.
          window.history.back();
        };
    </script>
</body>
</html>
