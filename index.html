<!DOCTYPE html>
<html>
<head>
    <title>Consultazione Mappa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #ffffff;
      }

      /*
       * Contenitore generale dell'intera pagina.
       * Lo zoom viene applicato qui, così emula lo zoom del browser.
       */
      .page-wrapper {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        transform-origin: top left;
        zoom: 1;
      }

      .map-container {
        position: relative;
        height: 100vh;
        width: 100vw;
      }

      /*
       * Iframe della mappa.
       * Rimane bloccato nelle interazioni dirette.
       */
      .map-iframe {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        border: none;
        pointer-events: none;
      }

      /*
       * Vetro protettivo: blocca pan/touch/click sulla mappa.
       */
      .glass-pane {
        position: absolute;
        top: 75px;
        left: 0;
        width: 100%;
        height: calc(100% - 75px);
        z-index: 10;
        background: rgba(255, 255, 255, 0);
      }

      /*
       * Pin al centro.
       */
      .center-pin {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -100%);
        z-index: 20;
        width: 35px;
        height: 35px;
        pointer-events: none;
        filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.3));
      }

      /*
       * Testata blu.
       */
      .custom-header {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 75px;
        background-color: #2c3e50;
        color: white;
        z-index: 100;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        box-sizing: border-box;
        padding: 0 15px;
        gap: 10px;
      }

      .header-info {
        display: flex;
        flex-direction: column;
        max-width: 45%;
        line-height: 1.15;
        min-width: 0;
      }

      .info-id {
        font-size: 20px;
        font-weight: bold;
        color: #f39c12;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .info-comune {
        font-size: 16px;
        font-weight: normal;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .info-localita {
        font-size: 13px;
        opacity: 0.8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-style: italic;
      }

      /*
       * ZOOM nella barra blu, al centro.
       */
      .zoom-control {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.10);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
        user-select: none;
        pointer-events: auto;
        flex: 0 0 auto;
      }

      .zoom-control button {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: #ecf0f1;
        color: #2c3e50;
        font-size: 22px;
        font-weight: bold;
        line-height: 32px;
        cursor: pointer;
        touch-action: manipulation;
      }

      .zoom-control button:hover {
        background: #ffffff;
      }

      .zoom-control button:active {
        transform: translateY(1px);
      }

      .zoom-control button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .zoom-label {
        min-width: 52px;
        color: #ffffff;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 0.6px;
        text-align: center;
      }

      .close-btn {
        background-color: #e74c3c;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
        text-transform: uppercase;
        transition: background-color 0.2s;
        pointer-events: auto;
        flex: 0 0 auto;
      }

      .close-btn:hover {
        background-color: #c0392b;
      }

      .close-btn:active {
        transform: translateY(1px);
      }

      /*
       * Su schermi stretti riduco il layout:
       * - niente chiudi
       * - zoom sempre visibile ma compatto
       */
      @media (max-width: 768px) {
        .custom-header {
          padding: 0 10px;
        }

        .header-info {
          max-width: 58%;
        }

        .info-id {
          font-size: 16px;
        }

        .info-comune {
          font-size: 13px;
        }

        .info-localita {
          font-size: 11px;
        }

        .close-btn {
          display: none !important;
        }

        .zoom-control {
          gap: 6px;
          padding: 4px 8px;
        }

        .zoom-control button {
          width: 34px;
          height: 34px;
          line-height: 34px;
        }
      }
    </style>
</head>
<body>
    <div class="page-wrapper" id="pageWrapper">
      <div class="map-container">

        <!-- Testata -->
        <div class="custom-header">
          <div class="header-info">
            <span class="info-id" id="displayId">ID: N/D</span>
            <span class="info-comune" id="displayComune">Comune: N/D</span>
            <span class="info-localita" id="displayLocalita">Località: N/D</span>
          </div>

          <!-- ZOOM al centro della barra blu -->
          <div class="zoom-control" aria-label="Controlli zoom pagina">
            <button id="zoomOutButton" type="button" aria-label="Riduci zoom" title="Riduci zoom">−</button>
            <span class="zoom-label" id="zoomLabel">100%</span>
            <button id="zoomInButton" type="button" aria-label="Aumenta zoom" title="Aumenta zoom">+</button>
          </div>

          <button class="close-btn" id="closeButton" type="button">CHIUDI</button>
        </div>

        <!-- Vetro protettivo -->
        <div class="glass-pane"></div>

        <!-- Pin centrale -->
        <div class="center-pin" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="#DB4437" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
        </div>

        <!-- Mappa -->
        <iframe id="googleMap" class="map-iframe" title="Mappa del patrimonio immobiliare" src=""></iframe>

      </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const lat = urlParams.get('lat') || '39.511889';
        const lng = urlParams.get('lng') || '8.547901';
        const idVal = urlParams.get('id') || 'N/D';
        const comuneVal = urlParams.get('comune') || 'N/D';
        const localitaVal = urlParams.get('localita') || 'N/D';

        const myMapsId = '1lQVisgwxED-JnABZDTxeDWWy5c52AdA';
        const googleMap = document.getElementById('googleMap');

        /*
         * Zoom pagina/browser emulato.
         * 1.0 = 100%
         * 1.1 = 110%
         * 0.9 = 90%
         */
        const MIN_PAGE_ZOOM = 0.75;
        const MAX_PAGE_ZOOM = 1.75;
        const ZOOM_STEP = 0.10;

        let pageZoom = 1.0;

        function applyPageZoom() {
          const wrapper = document.getElementById('pageWrapper');

          /*
           * Prova prima con CSS zoom.
           * Se il browser non lo supporta, usa transform scale.
           */
          wrapper.style.zoom = pageZoom;
          wrapper.style.transform = 'scale(' + pageZoom + ')';
          wrapper.style.width = (100 / pageZoom) + 'vw';
          wrapper.style.height = (100 / pageZoom) + 'vh';

          document.getElementById('zoomLabel').innerText =
            Math.round(pageZoom * 100) + '%';

          document.getElementById('zoomOutButton').disabled =
            pageZoom <= MIN_PAGE_ZOOM;

          document.getElementById('zoomInButton').disabled =
            pageZoom >= MAX_PAGE_ZOOM;
        }

        function changePageZoom(delta) {
          const nextZoom = Math.min(
            MAX_PAGE_ZOOM,
            Math.max(MIN_PAGE_ZOOM, pageZoom + delta)
          );

          if (nextZoom !== pageZoom) {
            pageZoom = Math.round(nextZoom * 100) / 100;
            applyPageZoom();
          }
        }

        function loadMap() {
          const mapUrl =
            'https://www.google.com/maps/d/embed' +
            '?mid=' + encodeURIComponent(myMapsId) +
            '&ll=' + encodeURIComponent(lat + ',' + lng) +
            '&z=18';

          googleMap.src = mapUrl;
        }

        window.history.replaceState(null, null, window.location.pathname);

        loadMap();

        document.getElementById('displayId').innerText = 'ID: ' + idVal;
        document.getElementById('displayComune').innerText = comuneVal;

        if (localitaVal !== 'N/D' && localitaVal.trim() !== '') {
          document.getElementById('displayLocalita').innerText = localitaVal;
        } else {
          document.getElementById('displayLocalita').style.display = 'none';
        }

        document.getElementById('zoomOutButton').addEventListener('click', function() {
          changePageZoom(-ZOOM_STEP);
        });

        document.getElementById('zoomInButton').addEventListener('click', function() {
          changePageZoom(ZOOM_STEP);
        });

        /*
         * Anche la rotellina con CTRL può agire sullo zoom pagina.
         */
        window.addEventListener('wheel', function(e) {
          if (!e.ctrlKey) return;

          e.preventDefault();

          if (e.deltaY < 0) {
            changePageZoom(ZOOM_STEP);
          } else {
            changePageZoom(-ZOOM_STEP);
          }
        }, { passive: false });

        document.getElementById('closeButton').onclick = function() {
          window.close();
          setTimeout(function() {
            window.history.back();
          }, 100);
        };

        applyPageZoom();
    </script>
</body>
</html>
