<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <title>Consultazione Mappa</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <style>
        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            background: #ffffff;
        }

        .page-wrapper {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;
        }

        .map-container {
            position: relative;

            width: 100vw;
            height: 100vh;
        }

        /*
         * Mappa Google My Maps.
         *
         * L'interazione nativa è disabilitata per impedire:
         * - trascinamento;
         * - pan;
         * - zoom nativo;
         * - clic sui poligoni.
         */
        .map-iframe {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: none;

            pointer-events: none;
        }

        /*
         * Vetro protettivo trasparente.
         */
        .glass-pane {
            position: absolute;

            top: 75px;
            left: 0;

            width: 100%;
            height: calc(100% - 75px);

            z-index: 10;

            background: rgba(255, 255, 255, 0);
        }

        /*
         * Pin rosso centrale.
         */
        .center-pin {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 35px;
            height: 35px;

            transform: translate(-50%, -100%);

            z-index: 20;

            pointer-events: none;

            filter: drop-shadow(
                0px 4px 3px rgba(0, 0, 0, 0.3)
            );
        }

        /*
         * Testata blu.
         */
        .custom-header {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 75px;

            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-sizing: border-box;
            padding: 0 15px;

            background-color: #2c3e50;
            color: #ffffff;

            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        /*
         * Informazioni dell'immobile.
         */
        .header-info {
            display: flex;
            flex-direction: column;

            min-width: 0;
            max-width: 70%;

            line-height: 1.2;
        }

        .info-id {
            overflow: hidden;

            color: #f39c12;

            font-size: 20px;
            font-weight: bold;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .info-comune {
            overflow: hidden;

            color: #ffffff;

            font-size: 16px;
            font-weight: normal;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .info-localita {
            overflow: hidden;

            color: #ffffff;
            opacity: 0.8;

            font-size: 13px;
            font-style: italic;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /*
         * Controlli zoom.
         *
         * Posizionati in alto a destra,
         * subito sotto la testata blu.
         */
        .zoom-control {
            position: fixed;

            top: 85px;
            right: 15px;
            left: auto;

            z-index: 300;

            display: flex;
            align-items: center;
            gap: 8px;

            box-sizing: border-box;
            padding: 5px 9px;

            border-radius: 7px;

            background: rgba(44, 62, 80, 0.96);

            box-shadow:
                0 2px 7px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.15);

            user-select: none;
            pointer-events: auto;
        }

        .zoom-control button {
            width: 34px;
            height: 34px;

            padding: 0;

            border: none;
            border-radius: 5px;

            background: #ecf0f1;
            color: #2c3e50;

            font-family: Arial, sans-serif;
            font-size: 23px;
            font-weight: bold;
            line-height: 34px;
            text-align: center;

            cursor: pointer;
            touch-action: manipulation;
        }

        .zoom-control button:hover {
            background: #ffffff;
        }

        .zoom-control button:active {
            transform: translateY(1px);
        }

        .zoom-control button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .zoom-label {
            min-width: 48px;

            color: #ffffff;

            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.4px;
            text-align: center;
        }

        /*
         * Pulsante Chiudi.
         */
        .close-btn {
            flex: 0 0 auto;

            padding: 8px 16px;

            border: none;
            border-radius: 4px;

            background-color: #e74c3c;
            color: #ffffff;

            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;

            cursor: pointer;
            pointer-events: auto;

            transition: background-color 0.2s;
        }

        .close-btn:hover {
            background-color: #c0392b;
        }

        .close-btn:active {
            transform: translateY(1px);
        }

        /*
         * Adattamento smartphone.
         */
        @media (max-width: 768px) {
            .custom-header {
                padding: 0 10px;
            }

            .header-info {
                max-width: 100%;
            }

            .close-btn {
                display: none !important;
            }

            .info-id {
                font-size: 17px;
            }

            .info-comune {
                font-size: 14px;
            }

            .info-localita {
                font-size: 11px;
            }

            .zoom-control {
                top: 85px;
                right: 10px;
                left: auto;

                gap: 6px;
                padding: 4px 7px;
            }

            .zoom-control button {
                width: 36px;
                height: 36px;

                font-size: 24px;
                line-height: 36px;
            }

            .zoom-label {
                min-width: 46px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <!-- Contenitore principale -->
    <div
        id="pageWrapper"
        class="page-wrapper">

        <div class="map-container">

            <!-- Testata -->
            <div class="custom-header">

                <div class="header-info">
                    <span
                        class="info-id"
                        id="displayId">
                        ID: N/D
                    </span>

                    <span
                        class="info-comune"
                        id="displayComune">
                        Comune: N/D
                    </span>

                    <span
                        class="info-localita"
                        id="displayLocalita">
                        Località: N/D
                    </span>
                </div>

                <button
                    class="close-btn"
                    id="closeButton"
                    type="button">
                    CHIUDI
                </button>
            </div>

            <!-- Vetro protettivo -->
            <div class="glass-pane"></div>

            <!-- Pin centrale -->
            <div
                class="center-pin"
                aria-hidden="true">

                <svg
                    viewBox="0 0 24 24"
                    fill="#DB4437"
                    xmlns="http://www.w3.org/2000/svg">

                    <path
                        d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
                    />
                </svg>
            </div>

            <!-- Mappa Google My Maps -->
            <iframe
                id="googleMap"
                class="map-iframe"
                title="Mappa del patrimonio immobiliare"
                src="">
            </iframe>

        </div>
    </div>

    <!-- Controlli zoom in alto a destra -->
    <div
        id="zoomControl"
        class="zoom-control"
        aria-label="Controlli zoom mappa">

        <button
            id="zoomOutButton"
            type="button"
            aria-label="Riduci zoom mappa"
            title="Riduci zoom mappa">
            −
        </button>

        <span
            id="zoomLabel"
            class="zoom-label">
            0
        </span>

        <button
            id="zoomInButton"
            type="button"
            aria-label="Aumenta zoom mappa"
            title="Aumenta zoom mappa">
            +
        </button>
    </div>

    <script>
        /*
         * Recupera un parametro dall'URL.
         *
         * La funzione cerca il parametro:
         * 1. nella query string normale;
         * 2. nell'hash dell'URL.
         *
         * Questo rende la lettura compatibile con diversi
         * comportamenti di AppSheet e del browser.
         */
        function getUrlParameter(parameterName) {
            const searchParams =
                new URLSearchParams(window.location.search);

            let value =
                searchParams.get(parameterName);

            if (value !== null && value !== '') {
                return value;
            }

            const hashValue =
                window.location.hash.startsWith('#')
                    ? window.location.hash.substring(1)
                    : window.location.hash;

            if (hashValue !== '') {
                const hashParams =
                    new URLSearchParams(
                        hashValue.startsWith('?')
                            ? hashValue.substring(1)
                            : hashValue
                    );

                value =
                    hashParams.get(parameterName);

                if (value !== null && value !== '') {
                    return value;
                }
            }

            return null;
        }


        /*
         * Lettura dei parametri passati da AppSheet.
         *
         * Vengono mantenuti i nomi già utilizzati:
         * lat, lng, id, comune, localita e zoom.
         */
        const latParameter =
            getUrlParameter('lat');

        const lngParameter =
            getUrlParameter('lng');

        const idParameter =
            getUrlParameter('id');

        const comuneParameter =
            getUrlParameter('comune');

        const localitaParameter =
            getUrlParameter('localita');

        const zoomParameter =
            getUrlParameter('zoom');


        /*
         * Valori geografici predefiniti.
         */
        const lat =
            latParameter || '39.511889';

        const lng =
            lngParameter || '8.547901';


        /*
         * Valori testuali predefiniti.
         */
        const idVal =
            idParameter || 'N/D';

        const comuneVal =
            comuneParameter || 'N/D';

        const localitaVal =
            localitaParameter || 'N/D';


        /*
         * Identificativo Google My Maps.
         */
        const myMapsId =
            '1lQVisgwxED-JnABZDTxeDWWy5c52AdA';

        const googleMap =
            document.getElementById('googleMap');


        /*
         * Configurazione dello zoom.
         *
         * Z14 è il livello originale e minimo.
         *
         * Z14 = 0
         * Z15 = +1
         * Z16 = +2
         * Z17 = +3
         * Z18 = +4
         */
        const BASE_MAP_ZOOM = 14;
        const MIN_MAP_ZOOM = 14;
        const MAX_MAP_ZOOM = 21;


        /*
         * Legge il valore zoom eventualmente passato da AppSheet.
         */
        let currentMapZoom =
            Number.parseInt(
                zoomParameter || BASE_MAP_ZOOM,
                10
            );

        if (!Number.isFinite(currentMapZoom)) {
            currentMapZoom =
                BASE_MAP_ZOOM;
        }

        currentMapZoom =
            Math.min(
                MAX_MAP_ZOOM,
                Math.max(MIN_MAP_ZOOM, currentMapZoom)
            );


        /*
         * Calcola l'etichetta relativa.
         */
        function getRelativeZoomLabel() {
            const relativeZoom =
                currentMapZoom - BASE_MAP_ZOOM;

            if (relativeZoom > 0) {
                return '+' + relativeZoom;
            }

            if (relativeZoom < 0) {
                return String(relativeZoom);
            }

            return '0';
        }


        /*
         * Aggiorna testo e stato dei pulsanti.
         */
        function updateZoomControls() {
            document
                .getElementById('zoomLabel')
                .innerText =
                getRelativeZoomLabel();

            document
                .getElementById('zoomOutButton')
                .disabled =
                currentMapZoom <= MIN_MAP_ZOOM;

            document
                .getElementById('zoomInButton')
                .disabled =
                currentMapZoom >= MAX_MAP_ZOOM;
        }


        /*
         * Carica o ricarica la mappa.
         */
        function loadMapWithCurrentZoom() {
            const mapUrl =
                'https://www.google.com/maps/d/embed' +
                '?mid=' + encodeURIComponent(myMapsId) +
                '&ll=' + encodeURIComponent(lat + ',' + lng) +
                '&z=' + encodeURIComponent(currentMapZoom);

            googleMap.src =
                mapUrl;

            updateZoomControls();
        }


        /*
         * Aumenta lo zoom.
         *
         * 0 -> +1 -> +2 -> +3
         */
        function increaseMapZoom() {
            if (currentMapZoom < MAX_MAP_ZOOM) {
                currentMapZoom =
                    currentMapZoom + 1;

                loadMapWithCurrentZoom();
            }
        }


        /*
         * Riduce lo zoom.
         *
         * +3 -> +2 -> +1 -> 0
         *
         * Il valore non può diventare negativo.
         */
        function decreaseMapZoom() {
            if (currentMapZoom > MIN_MAP_ZOOM) {
                currentMapZoom =
                    currentMapZoom - 1;

                loadMapWithCurrentZoom();
            }
        }


        /*
         * Caricamento iniziale della mappa.
         */
        loadMapWithCurrentZoom();


        /*
         * Valorizzazione della testata.
         */
        document
            .getElementById('displayId')
            .innerText =
            'ID: ' + idVal;

        document
            .getElementById('displayComune')
            .innerText =
            comuneVal;


        /*
         * Gestione del campo Località.
         */
        if (
            localitaVal !== 'N/D' &&
            localitaVal.trim() !== ''
        ) {
            document
                .getElementById('displayLocalita')
                .innerText =
                localitaVal;
        } else {
            document
                .getElementById('displayLocalita')
                .style.display =
                'none';
        }


        /*
         * Eventi dei pulsanti zoom.
         */
        document
            .getElementById('zoomInButton')
            .addEventListener(
                'click',
                increaseMapZoom
            );

        document
            .getElementById('zoomOutButton')
            .addEventListener(
                'click',
                decreaseMapZoom
            );


        /*
         * Pulsante Chiudi.
         */
        document
            .getElementById('closeButton')
            .addEventListener(
                'click',
                function() {
                    window.close();

                    setTimeout(
                        function() {
                            window.history.back();
                        },
                        100
                    );
                }
            );


        /*
         * Rimuove i parametri dalla barra degli indirizzi
         * soltanto dopo averli letti e utilizzati.
         */
        try {
            window.history.replaceState(
                null,
                null,
                window.location.pathname
            );
        } catch (error) {
            /*
             * Se il browser impedisce la modifica dell'URL,
             * la pagina continua comunque a funzionare.
             */
        }
    </script>

</body>
</html>
