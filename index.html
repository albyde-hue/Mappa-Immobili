<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>CONCESSIONI IGEA S.p.A.</title>

  <style>
    :root {
      --header-height: 75px;
      --header-color: #2c3e50;
      --id-color: #f39c12;
      --button-color: #e74c3c;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    #mappa {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .custom-header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      width: 100%;
      height: var(--header-height);
      padding: 0 15px;
      color: #ffffff;
      background: var(--header-color);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
    }

    .header-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      max-width: 75%;
      line-height: 1.2;
    }

    .info-id,
    .info-comune,
    .info-localita {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .info-id {
      color: var(--id-color);
      font-size: 20px;
      font-weight: 700;
    }

    .info-comune {
      color: #ffffff;
      font-size: 16px;
    }

    .info-localita {
      color: #ffffff;
      opacity: 0.8;
      font-size: 13px;
      font-style: italic;
    }

    .close-btn {
      flex: 0 0 auto;
      padding: 8px 16px;
      border: 0;
      border-radius: 4px;
      color: #ffffff;
      background: var(--button-color);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .close-btn:hover {
      background: #c0392b;
    }

    .center-pin {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 50;
      width: 40px;
      height: 40px;
      transform: translate(-50%, -100%);
      pointer-events: none;
      filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.35));
    }

    .zoom-control {
      position: fixed;
      top: calc(var(--header-height) + 10px);
      right: 15px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 9px;
      border-radius: 7px;
      color: #ffffff;
      background: rgba(44, 62, 80, 0.96);
      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    .zoom-control button {
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      color: #2c3e50;
      background: #ecf0f1;
      cursor: pointer;
      font-size: 23px;
      font-weight: 700;
      line-height: 34px;
      text-align: center;
    }

    .zoom-control button:hover {
      background: #ffffff;
    }

    .zoom-control button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .zoom-label {
      min-width: 48px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    @media (max-width: 768px) {
      .custom-header {
        padding: 0 10px;
      }

      .header-info {
        max-width: 100%;
      }

      .close-btn {
        display: none;
      }

      .info-id {
        font-size: 17px;
      }

      .info-comune {
        font-size: 14px;
      }

      .info-localita {
        font-size: 11px;
      }
