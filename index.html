<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <title>Consultazione Mappa</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <style>
        /*
         * Impostazioni generali
         */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
        }

        /*
         * Contenitore principale.
         *
         * Lo zoom applicativo viene impostato tramite la proprietà CSS zoom
         * dal codice JavaScript.
         */
        .page-wrapper {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            transform-origin: top left;
        }

        .map-container {
            position: relative;

            width: 100vw;
            height: 100vh;
        }

        /*
         * Mappa Google My Maps.
         *
         * pointer-events: none impedisce all'utente di:
         * - trascinare la mappa;
         * - effettuare pan;
         * - utilizzare lo zoom nativo;
         * - interagire direttamente con i poligoni.
         */
        .map-iframe {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: none;

            pointer-events: none;
        }

        /*
         * Vetro protettivo trasparente.
         *
         * Blocca le interazioni dalla parte sottostante la testata.
         */
        .glass-pane {
            position: absolute;

            top: 75px;
            left: 0;

            width: 100%;
            height: calc(100% - 75px);

            z-index: 10;

            background: rgba(255, 255, 255, 0);
        }

        /*
         * Pin rosso centrale.
         */
        .center-pin {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 35px;
            height: 35px;

            transform: translate(-50%, -100%);

            z-index: 20;

            pointer-events: none;

            filter: drop-shadow(
                0px 4px 3px rgba(0, 0, 0, 0.3)
            );
        }

        /*
         * Testata blu.
         */
        .custom-header {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 75px;

            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-sizing: border-box;
            padding: 0 15px;

            background-color: #2c3e50;
            color: #ffffff;

            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        /*
         * Informazioni dell'immobile.
         */
        .header-info {
            display: flex;
            flex-direction: column;

            min-width: 0;
            max-width: 70%;

            line-height: 1.2;
        }

        .info-id {
            overflow: hidden;

            color: #f39c12;

            font-size: 20px;
            font-weight: bold;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .info-comune {
            overflow: hidden;

            color: #ffffff;

            font-size: 16px;
            font-weight: normal;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .info-localita {
            overflow: hidden;

            color: #ffffff;
            opacity: 0.8;

            font-size: 13px;
            font-style: italic;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /*
         * Controllo zoom.
         *
         * È volutamente fuori da .page-wrapper:
         * in questo modo resta sempre ancorato alla finestra,
         * in alto a sinistra, indipendentemente dallo zoom applicato.
         */
        .zoom-control {
            position: fixed;

            top: 85px;
            left: 15px;

            z-index: 300;

            display: flex;
            align-items: center;
            gap: 8px;

            box-sizing: border-box;
            padding: 5px 9px;

            border-radius: 7px;

            background: rgba(44, 62, 80, 0.96);

            box-shadow:
                0 2px 7px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.15);

            user-select: none;
            pointer-events: auto;
        }

        .zoom-control button {
            width: 34px;
            height: 34px;

            padding: 0;

            border: none;
            border-radius: 5px;

            background: #ecf0f1;
            color: #2c3e50;

            font-family: Arial, sans-serif;
            font-size: 23px;
            font-weight: bold;
            line-height: 34px;
            text-align: center;

            cursor: pointer;
            touch-action: manipulation;
        }

        .zoom-control button:hover {
            background: #ffffff;
        }

        .zoom-control button:active {
            transform: translateY(1px);
        }

        .zoom-control button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .zoom-label {
            min-width: 48px;

            color: #ffffff;

            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.4px;
            text-align: center;
        }

        /*
         * Pulsante Chiudi.
         */
        .close-btn {
            flex: 0 0 auto;

            padding: 8px 16px;

            border: none;
            border-radius: 4px;

            background-color: #e74c3c;
            color: #ffffff;

            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;

            cursor: pointer;
            pointer-events: auto;

            transition: background-color 0.2s;
        }

        .close-btn:hover {
            background-color: #c0392b;
        }

        .close-btn:active {
            transform: translateY(1px);
        }

        /*
         * Adattamento smartphone.
         */
        @media (max-width: 768px) {
            .custom-header {
                padding: 0 10px;
            }

            .header-info {
                max-width: 100%;
            }

            .close-btn {
                display: none !important;
            }

            .info-id {
                font-size: 17px;
            }

            .info-comune {
                font-size: 14px;
            }

            .info-localita {
                font-size: 11px;
            }

            .zoom-control {
                top: 85px;
                left: 10px;

                gap: 6px;
                padding: 4px 7px;
            }

            .zoom-control button {
                width: 36px;
                height: 36px;

                font-size: 24px;
                line-height: 36px;
            }

            .zoom-label {
                min-width: 46px;
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <!--
     * Contenitore della mappa e della testata.
     * Lo zoom applicativo viene applicato a questo elemento.
     -->
    <div
        id="pageWrapper"
        class="page-wrapper">

        <div class="map-container">

            <!-- Testata -->
            <div class="custom-header">

                <div class="header-info">
                    <span
                        class="info-id"
                        id="displayId">
                        ID: N/D
                    </span>

                    <span
                        class="info-comune"
                        id="displayComune">
                        Comune: N/D
                    </span>

                    <span
                        class="info-localita"
                        id="displayLocalita">
                        Località: N/D
                    </span>
                </div>

                <button
                    class="close-btn"
                    id="closeButton"
                    type="button">
                    CHIUDI
                </button>
            </div>

            <!-- Vetro protettivo -->
            <div class="glass-pane"></div>

            <!-- Pin centrale -->
            <div
                class="center-pin"
                aria-hidden="true">

                <svg
                    viewBox="0 0 24 24"
                    fill="#DB4437"
                    xmlns="http://www.w3.org/2000/svg">

                    <path
                        d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
                    />
                </svg>
            </div>

            <!-- Mappa Google My Maps -->
            <iframe
                id="googleMap"
                class="map-iframe"
                title="Mappa del patrimonio immobiliare"
                src="">
            </iframe>

        </div>
    </div>

    <!--
     * Controllo zoom.
     *
     * È fuori dal page-wrapper per rimanere fisso
     * in alto a sinistra.
     -->
    <div
        id="zoomControl"
        class="zoom-control"
        aria-label="Controlli zoom pagina">

        <button
            id="zoomOutButton"
            type="button"
            aria-label="Riduci zoom"
            title="Riduci zoom">
            −
        </button>

        <span
            id="zoomLabel"
            class="zoom-label">
            100%
        </span>

        <button
            id="zoomInButton"
            type="button"
            aria-label="Aumenta zoom"
            title="Aumenta zoom">
            +
        </button>
    </div>

    <script>
        /*
         * Lettura dei parametri passati da AppSheet.
         */
        const urlParams =
            new URLSearchParams(window.location.search);

        const lat =
            urlParams.get('lat') || '39.511889';

        const lng =
            urlParams.get('lng') || '8.547901';

        const idVal =
            urlParams.get('id') || 'N/D';

        const comuneVal =
            urlParams.get('comune') || 'N/D';

        const localitaVal =
            urlParams.get('localita') || 'N/D';

        const zoomVal =
            urlParams.get('zoom') || '18';


        /*
         * Identificativo della mappa My Maps.
         */
        const myMapsId =
            '1lQVisgwxED-JnABZDTxeDWWy5c52AdA';

        const googleMap =
            document.getElementById('googleMap');


        /*
         * Caricamento della mappa.
         *
         * Il parametro z riguarda lo zoom iniziale
         * della mappa My Maps.
         *
         * I pulsanti della pagina agiscono invece
         * sullo zoom visivo dell'intera pagina.
         */
        function loadMap() {
            const mapUrl =
                'https://www.google.com/maps/d/embed' +
                '?mid=' + encodeURIComponent(myMapsId) +
                '&ll=' + encodeURIComponent(lat + ',' + lng) +
                '&z=' + encodeURIComponent(zoomVal);

            googleMap.src = mapUrl;
        }


        /*
         * Configurazione zoom pagina.
         */
        const MIN_PAGE_ZOOM = 0.75;
        const MAX_PAGE_ZOOM = 1.75;
        const PAGE_ZOOM_STEP = 0.10;

        let pageZoom = 1.00;


        /*
         * Aggiorna lo zoom visivo della pagina.
         *
         * Chrome ed Edge supportano la proprietà CSS zoom.
         * Il fallback con transform viene utilizzato
         * soltanto dai browser che non la supportano.
         */
        function applyPageZoom() {
            const pageWrapper =
                document.getElementById('pageWrapper');

            const zoomLabel =
                document.getElementById('zoomLabel');

            const zoomOutButton =
                document.getElementById('zoomOutButton');

            const zoomInButton =
                document.getElementById('zoomInButton');

            const supportsCssZoom =
                typeof CSS !== 'undefined' &&
                CSS.supports &&
                CSS.supports('zoom', '1');

            if (supportsCssZoom) {
                pageWrapper.style.zoom =
                    String(pageZoom);

                pageWrapper.style.transform =
                    'none';

                pageWrapper.style.width =
                    '100vw';

                pageWrapper.style.height =
                    '100vh';
            } else {
                pageWrapper.style.zoom =
                    '1';

                pageWrapper.style.transform =
                    'scale(' + pageZoom + ')';

                pageWrapper.style.width =
                    (100 / pageZoom) + 'vw';

                pageWrapper.style.height =
                    (100 / pageZoom) + 'vh';
            }

            zoomLabel.innerText =
                Math.round(pageZoom * 100) + '%';

            zoomOutButton.disabled =
                pageZoom <= MIN_PAGE_ZOOM;

            zoomInButton.disabled =
                pageZoom >= MAX_PAGE_ZOOM;
        }


        /*
         * Modifica dello zoom pagina.
         */
        function changePageZoom(amount) {
            let nextZoom =
                pageZoom + amount;

            nextZoom =
                Math.max(MIN_PAGE_ZOOM, nextZoom);

            nextZoom =
                Math.min(MAX_PAGE_ZOOM, nextZoom);

            nextZoom =
                Math.round(nextZoom * 100) / 100;

            if (nextZoom !== pageZoom) {
                pageZoom = nextZoom;
                applyPageZoom();
            }
        }


        /*
         * Inizializzazione della pagina.
         */
        window.history.replaceState(
            null,
            null,
            window.location.pathname
        );

        loadMap();


        /*
         * Valorizzazione della testata.
         */
        document.getElementById('displayId').innerText =
            'ID: ' + idVal;

        document.getElementById('displayComune').innerText =
            comuneVal;


        /*
         * Gestione del campo Località.
         */
        if (
            localitaVal !== 'N/D' &&
            localitaVal.trim() !== ''
        ) {
            document.getElementById('displayLocalita').innerText =
                localitaVal;
        } else {
            document.getElementById('displayLocalita').style.display =
                'none';
        }


        /*
         * Eventi pulsanti zoom.
         */
        document
            .getElementById('zoomOutButton')
            .addEventListener('click', function() {
                changePageZoom(-PAGE_ZOOM_STEP);
            });

        document
            .getElementById('zoomInButton')
            .addEventListener('click', function() {
                changePageZoom(PAGE_ZOOM_STEP);
            });


        /*
         * Supporto alla combinazione CTRL + rotellina.
         *
         * Questa funzione emula lo zoom applicativo della pagina.
         */
        window.addEventListener(
            'wheel',
            function(event) {
                if (!event.ctrlKey) {
                    return;
                }

                event.preventDefault();

                if (event.deltaY < 0) {
                    changePageZoom(PAGE_ZOOM_STEP);
                } else {
                    changePageZoom(-PAGE_ZOOM_STEP);
                }
            },
            {
                passive: false
            }
        );


        /*
         * Pulsante Chiudi.
         */
        document
            .getElementById('closeButton')
            .addEventListener('click', function() {
                window.close();

                setTimeout(function() {
                    window.history.back();
                }, 100);
            });


        /*
         * Applicazione iniziale dello zoom al 100%.
         */
        applyPageZoom();
    </script>

</body>
</html>
