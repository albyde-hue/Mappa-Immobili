<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <title>Consultazione Mappa</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <style>
        /*
         * IMPOSTAZIONI GENERALI
         */
        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
        }

        /*
         * Contenitore principale della pagina.
         */
        .map-container {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #ffffff;
        }

        /*
         * LIVELLO MAPPA
         *
         * Questo livello viene ingrandito o ridotto con transform: scale().
         * Il punto di trasformazione è il centro esatto della finestra.
         *
         * In questo modo il centro della mappa, il pin e le coordinate
         * rimangono sempre nella stessa posizione.
         */
        .map-layer {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 1;

            overflow: hidden;

            transform-origin: center center;
            transform: scale(1);

            background: #ffffff;

            transition: transform 0.15s ease-out;
        }

        /*
         * IFRAME GOOGLE MY MAPS
         *
         * pointer-events: none mantiene bloccati:
         * - trascinamento;
         * - pan;
         * - zoom nativo della mappa;
         * - clic sui poligoni;
         * - interazioni con i layer.
         */
        .map-iframe {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: none;

            pointer-events: none;
        }

        /*
         * VETRO PROTETTIVO
         *
         * Copre la mappa dalla parte inferiore della testata.
         * Rimane trasparente, ma impedisce ogni interazione.
         */
        .glass-pane {
            position: absolute;

            top: 75px;
            left: 0;

            width: 100%;
            height: calc(100% - 75px);

            z-index: 10;

            background: rgba(255, 255, 255, 0);

            pointer-events: auto;
        }

        /*
         * TESTATA BLU
         *
         * È posizionata fuori dal map-layer.
         * Pertanto non viene ingrandita o ridotta durante lo zoom.
         */
        .custom-header {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 75px;

            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-sizing: border-box;
            padding: 0 15px;

            background-color: #2c3e50;
            color: #ffffff;

            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        /*
         * Informazioni dell'immobile.
         */
        .header-info {
            display: flex;
            flex-direction: column;

            min-width: 0;
            max-width: 70%;

            line-height: 1.2;
        }

        .info-id {
            overflow: hidden;

            color: #f39c12;

            font-size: 20px;
            font-weight: bold;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .info-comune {
            overflow: hidden;

            color: #ffffff;

            font-size: 16px;
            font-weight: normal;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .info-localita {
            overflow: hidden;

            color: #ffffff;
            opacity: 0.8;

            font-size: 13px;
            font-style: italic;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /*
         * PIN CENTRALE
         *
         * Il pin è fuori dal map-layer e quindi resta sempre della
         * stessa dimensione e nella stessa posizione.
         *
         * Il centro del pin coincide con il centro della mappa.
         */
        .center-pin {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 35px;
            height: 35px;

            transform: translate(-50%, -100%);

            z-index: 120;

            pointer-events: none;

            filter: drop-shadow(
                0 4px 3px rgba(0, 0, 0, 0.3)
            );
        }

        /*
         * CONTROLLO ZOOM
         *
         * Fuori dal map-layer:
         * - resta sempre in alto a sinistra;
         * - non cambia dimensione;
         * - non viene ingrandito insieme alla mappa.
         */
        .zoom-control {
            position: fixed;

            top: 85px;
            left: 15px;

            z-index: 300;

            display: flex;
            align-items: center;
            gap: 8px;

            box-sizing: border-box;
            padding: 5px 9px;

            border-radius: 7px;

            background: rgba(44, 62, 80, 0.96);

            box-shadow:
                0 2px 7px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.15);

            user-select: none;
            pointer-events: auto;
        }

        .zoom-control button {
            width: 34px;
            height: 34px;

            padding: 0;

            border: none;
            border-radius: 5px;

            background: #ecf0f1;
            color: #2c3e50;

            font-family: Arial, sans-serif;
            font-size: 23px;
            font-weight: bold;
            line-height: 34px;
            text-align: center;

            cursor: pointer;
            touch-action: manipulation;
        }

        .zoom-control button:hover {
            background: #ffffff;
        }

        .zoom-control button:active {
            transform: translateY(1px);
        }

        .zoom-control button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .zoom-label {
            min-width: 48px;

            color: #ffffff;

            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.4px;
            text-align: center;
        }

        /*
         * PULSANTE CHIUDI
         */
        .close-btn {
            flex: 0 0 auto;

            padding: 8px 16px;

            border: none;
            border-radius: 4px;

            background-color: #e74c3c;
            color: #ffffff;

            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;

            cursor: pointer;
            pointer-events: auto;

            transition: background-color 0.2s;
        }

        .close-btn:hover {
            background-color: #c0392b;
        }

        .close-btn:active {
            transform: translateY(1px);
        }

        /*
         * SMARTPHONE
         */
        @media (max-width: 768px) {
            .custom-header {
                padding: 0 10px;
            }

            .header-info {
                max-width: 100%;
            }

            .close-btn {
                display: none !important;
            }

            .info-id {
                font-size: 17px;
            }

            .info-comune {
                font-size: 14px;
            }

            .info-localita {
                font-size: 11px;
            }

            .zoom-control {
                top: 85px;
                left: 10px;

                gap: 6px;
                padding: 4px 7px;
            }

            .zoom-control button {
                width: 36px;
                height: 36px;

                font-size: 24px;
                line-height: 36px;
            }

            .zoom-label {
                min-width: 46px;
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="map-container">

        <!--
         * LIVELLO MAPPA
         *
         * Solo questo elemento viene sottoposto allo zoom.
         * La trasformazione avviene dal centro della finestra.
         -->
        <div
            id="mapLayer"
            class="map-layer">

            <iframe
                id="googleMap"
                class="map-iframe"
                title="Mappa del patrimonio immobiliare"
                src="">
            </iframe>
        </div>

        <!-- Vetro protettivo -->
        <div class="glass-pane"></div>

        <!-- Testata non soggetta allo zoom -->
        <div class="custom-header">

            <div class="header-info">
                <span
                    class="info-id"
                    id="displayId">
                    ID: N/D
                </span>

                <span
                    class="info-comune"
                    id="displayComune">
                    Comune: N/D
                </span>

                <span
                    class="info-localita"
                    id="displayLocalita">
                    Località: N/D
                </span>
            </div>

            <button
                class="close-btn"
                id="closeButton"
                type="button">
                CHIUDI
            </button>
        </div>

        <!-- Pin fisso al centro -->
        <div
            class="center-pin"
            aria-hidden="true">

            <svg
                viewBox="0 0 24 24"
                fill="#DB4437"
                xmlns="http://www.w3.org/2000/svg">

                <path
                    d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
                />
            </svg>
        </div>

        <!-- Controlli zoom fissi in alto a sinistra -->
        <div
            id="zoomControl"
            class="zoom-control"
            aria-label="Controlli zoom mappa">

            <button
                id="zoomOutButton"
                type="button"
                aria-label="Riduci zoom"
                title="Riduci zoom">
                −
            </button>

            <span
                id="zoomLabel"
                class="zoom-label">
                100%
            </span>

            <button
                id="zoomInButton"
                type="button"
                aria-label="Aumenta zoom"
                title="Aumenta zoom">
                +
            </button>
        </div>

    </div>

    <script>
        /*
         * LETTURA PARAMETRI APPSHEET
         */
        const urlParams =
            new URLSearchParams(window.location.search);

        const lat =
            urlParams.get('lat') || '39.511889';

        const lng =
            urlParams.get('lng') || '8.547901';

        const idVal =
            urlParams.get('id') || 'N/D';

        const comuneVal =
            urlParams.get('comune') || 'N/D';

        const localitaVal =
            urlParams.get('localita') || 'N/D';

        const initialMapZoom =
            urlParams.get('zoom') || '18';


        /*
         * IDENTIFICATIVO MY MAPS
         */
        const myMapsId =
            '1lQVisgwxED-JnABZDTxeDWWy5c52AdA';

        const googleMap =
            document.getElementById('googleMap');

        const mapLayer =
            document.getElementById('mapLayer');


        /*
         * CONFIGURAZIONE ZOOM VISIVO DELLA MAPPA
         *
         * 1.00 = 100%
         * 1.10 = 110%
         * 0.90 = 90%
         */
        const MIN_MAP_ZOOM = 0.75;
        const MAX_MAP_ZOOM = 2.00;
        const MAP_ZOOM_STEP = 0.10;

        let mapZoom = 1.00;


        /*
         * CARICAMENTO MAPPA
         *
         * ll contiene le coordinate dell'immobile.
         * z imposta lo zoom iniziale di My Maps.
         *
         * Lo zoom dei pulsanti viene applicato successivamente
         * al map-layer tramite CSS, senza ricaricare l'iframe.
         */
        function loadMap() {
            const mapUrl =
                'https://www.google.com/maps/d/embed' +
                '?mid=' + encodeURIComponent(myMapsId) +
                '&ll=' + encodeURIComponent(lat + ',' + lng) +
                '&z=' + encodeURIComponent(initialMapZoom);

            googleMap.src = mapUrl;
        }


        /*
         * APPLICA ZOOM ALLA SOLA MAPPA
         *
         * transform-origin: center center garantisce che:
         * - il centro della mappa resti fermo;
         * - il pin resti sulle coordinate dell'immobile;
         * - la testata non venga ingrandita;
         * - i controlli non vengano ingranditi.
         */
        function applyMapZoom() {
            mapLayer.style.transform =
                'scale(' + mapZoom + ')';

            document.getElementById('zoomLabel').innerText =
                Math.round(mapZoom * 100) + '%';

            document.getElementById('zoomOutButton').disabled =
                mapZoom <= MIN_MAP_ZOOM;

            document.getElementById('zoomInButton').disabled =
                mapZoom >= MAX_MAP_ZOOM;
        }


        /*
         * MODIFICA ZOOM
         */
        function changeMapZoom(amount) {
            let nextZoom =
                mapZoom + amount;

            nextZoom =
                Math.max(MIN_MAP_ZOOM, nextZoom);

            nextZoom =
                Math.min(MAX_MAP_ZOOM, nextZoom);

            nextZoom =
                Math.round(nextZoom * 100) / 100;

            if (nextZoom !== mapZoom) {
                mapZoom = nextZoom;
                applyMapZoom();
            }
        }


        /*
         * INIZIALIZZAZIONE
         */
        window.history.replaceState(
            null,
            null,
            window.location.pathname
        );

        loadMap();

        applyMapZoom();


        /*
         * TESTATA
         */
        document.getElementById('displayId').innerText =
            'ID: ' + idVal;

        document.getElementById('displayComune').innerText =
            comuneVal;


        /*
         * LOCALITÀ
         */
        if (
            localitaVal !== 'N/D' &&
            localitaVal.trim() !== ''
        ) {
            document.getElementById('displayLocalita').innerText =
                localitaVal;
        } else {
            document.getElementById('displayLocalita').style.display =
                'none';
        }


        /*
         * PULSANTI ZOOM
         */
        document
            .getElementById('zoomOutButton')
            .addEventListener('click', function() {
                changeMapZoom(-MAP_ZOOM_STEP);
            });

        document
            .getElementById('zoomInButton')
            .addEventListener('click', function() {
                changeMapZoom(MAP_ZOOM_STEP);
            });


        /*
         * CTRL + ROTELLINA DEL MOUSE
         *
         * Questa funzione emula il comportamento richiesto:
         * tenendo premuto CTRL e usando la rotellina,
         * viene ingrandito o ridotto il solo livello mappa.
         */
        window.addEventListener(
            'wheel',
            function(event) {
                if (!event.ctrlKey) {
                    return;
                }

                event.preventDefault();

                if (event.deltaY < 0) {
                    changeMapZoom(MAP_ZOOM_STEP);
                } else {
                    changeMapZoom(-MAP_ZOOM_STEP);
                }
            },
            {
                passive: false
            }
        );


        /*
         * PULSANTE CHIUDI
         */
        document
            .getElementById('closeButton')
            .addEventListener('click', function() {
                window.close();

                setTimeout(function() {
                    window.history.back();
                }, 100);
            });
    </script>

</body>
</html>
