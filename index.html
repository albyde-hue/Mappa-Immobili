<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <title>CONCESSIONI IGEA S.p.A.</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .page-wrapper,
    .map-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .map-iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }

    .glass-pane {
      position: absolute;
      top: 75px;
      left: 0;
      z-index: 10;
      width: 100%;
      height: calc(100% - 75px);
      background: transparent;
    }

    .custom-header {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      width: 100%;
      height: 75px;
      padding: 0 15px;
      color: #ffffff;
      background: #2c3e50;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
    }

    .header-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      max-width: 72%;
      line-height: 1.2;
    }

    .info-id,
    .info-comune,
    .info-localita {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .info-id {
      color: #f39c12;
      font-size: 20px;
      font-weight: 700;
    }

    .info-comune {
      color: #ffffff;
      font-size: 16px;
      font-weight: 400;
    }

    .info-localita {
      color: #ffffff;
      opacity: 0.8;
      font-size: 13px;
      font-style: italic;
    }

    .close-btn {
      flex: 0 0 auto;
      padding: 8px 16px;
      border: 0;
      border-radius: 4px;
      color: #ffffff;
      background: #e74c3c;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .close-btn:hover {
      background: #c0392b;
    }

    .close-btn:active {
      transform: translateY(1px);
    }

    .center-pin {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 20;
      width: 38px;
      height: 38px;
      transform: translate(-50%, -100%);
      pointer-events: none;
      filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.35));
    }

    .zoom-control {
      position: fixed;
      top: 85px;
      right: 15px;
      z-index: 300;
      display: flex;
      align-items: center;
      gap: 8px;
      box-sizing: border-box;
      padding: 5px 9px;
      border-radius: 7px;
      color: #ffffff;
      background: rgba(44, 62, 80, 0.96);
      box-shadow:
        0 2px 7px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.15);
      user-select: none;
    }

    .zoom-control button {
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      color: #2c3e50;
      background: #ecf0f1;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 23px;
      font-weight: 700;
      line-height: 34px;
      text-align: center;
      touch-action: manipulation;
    }

    .zoom-control button:hover {
      background: #ffffff;
    }

    .zoom-control button:active {
      transform: translateY(1px);
    }

    .zoom-control button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .zoom-label {
      min-width: 48px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-align: center;
    }

    @media (max-width: 768px) {
      .custom-header {
        padding: 0 10px;
      }

      .header-info {
        max-width: 100%;
      }

      .close-btn {
        display: none;
      }

      .info-id {
        font-size: 17px;
      }

      .info-comune {
        font-size: 14px;
      }

      .info-localita {
        font-size: 11px;
      }

      .zoom-control {
        top: 85px;
        right: 10px;
        gap: 6px;
        padding: 4px 7px;
      }

      .zoom-control button {
        width: 36px;
        height: 36px;
        font-size: 24px;
        line-height: 36px;
      }

      .zoom-label {
        min-width: 46px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <div class="page-wrapper">
    <div class="map-container">

      <div class="custom-header">
        <div class="header-info">
          <span id="displayId" class="info-id">ID: N/D</span>
          <span id="displayComune" class="info-comune">Comune: N/D</span>
          <span id="displayLocalita" class="info-localita">Località: N/D</span>
        </div>

        <button id="closeButton" class="close-btn" type="button">
          CHIUDI
        </button>
      </div>

      <div class="glass-pane" aria-hidden="true"></div>

      <div class="center-pin" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="#DB4437"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
          />
        </svg>
      </div>

      <iframe
        id="googleMap"
        class="map-iframe"
        title="Mappa concessioni IGEA"
        src=""
      ></iframe>
    </div>
  </div>

  <div id="zoomControl" class="zoom-control" aria-label="Controlli zoom mappa">
    <button
      id="zoomOutButton"
      type="button"
      aria-label="Riduci zoom mappa"
      title="Riduci zoom mappa"
    >
      −
    </button>

    <span id="zoomLabel" class="zoom-label">0</span>

    <button
      id="zoomInButton"
      type="button"
      aria-label="Aumenta zoom mappa"
      title="Aumenta zoom mappa"
    >
      +
    </button>
  </div>

  <script>
    function getUrlParameter(parameterName) {
      const searchParams = new URLSearchParams(window.location.search);
      let value = searchParams.get(parameterName);

      if (value !== null && value !== "") {
        return value;
      }

      const hashValue = window.location.hash.startsWith("#")
        ? window.location.hash.substring(1)
        : window.location.hash;

      if (hashValue !== "") {
        const hashParams = new URLSearchParams(
          hashValue.startsWith("?") ? hashValue.substring(1) : hashValue
        );

        value = hashParams.get(parameterName);

        if (value !== null && value !== "") {
          return value;
        }
      }

      return null;
    }

    const latParameter = getUrlParameter("lat");
    const lngParameter = getUrlParameter("lng");
    const idParameter = getUrlParameter("id");
    const comuneParameter = getUrlParameter("comune");
    const localitaParameter = getUrlParameter("localita");
    const zoomParameter = getUrlParameter("zoom");

    const lat = latParameter || "39.511889";
    const lng = lngParameter || "8.547901";
    const idVal = idParameter || "N/D";
    const comuneVal = comuneParameter || "N/D";
    const localitaVal = localitaParameter || "";

    const myMapsId = "1bxno4JIrzoUtn1eHwdDXpsJCEUHvHi8";
    const googleMap = document.getElementById("googleMap");

    const BASE_MAP_ZOOM = 14;
    const MIN_MAP_ZOOM = 14;
    const MAX_MAP_ZOOM = 21;

    let currentMapZoom = Number.parseInt(
      zoomParameter || BASE_MAP_ZOOM,
      10
    );

    if (!Number.isFinite(currentMapZoom)) {
      currentMapZoom = BASE_MAP_ZOOM;
    }

    currentMapZoom = Math.min(
      MAX_MAP_ZOOM,
      Math.max(MIN_MAP_ZOOM, currentMapZoom)
    );

    function getRelativeZoomLabel() {
      const relativeZoom = currentMapZoom - BASE_MAP_ZOOM;
      return relativeZoom > 0 ? "+" + relativeZoom : String(relativeZoom);
    }

    function updateZoomControls() {
      document.getElementById("zoomLabel").innerText =
        getRelativeZoomLabel();

      document.getElementById("zoomOutButton").disabled =
        currentMapZoom <= MIN_MAP_ZOOM;

      document.getElementById("zoomInButton").disabled =
        currentMapZoom >= MAX_MAP_ZOOM;
    }

    function loadMapWithCurrentZoom() {
      const mapUrl =
        "https://www.google.com/maps/d/embed" +
        "?mid=" + encodeURIComponent(myMapsId) +
        "&ll=" + encodeURIComponent(lat + "," + lng) +
        "&z=" + encodeURIComponent(currentMapZoom);

      googleMap.src = mapUrl;
      updateZoomControls();
    }

    function increaseMapZoom() {
      if (currentMapZoom < MAX_MAP_ZOOM) {
        currentMapZoom += 1;
        loadMapWithCurrentZoom();
      }
    }

    function decreaseMapZoom() {
      if (currentMapZoom > MIN_MAP_ZOOM) {
        currentMapZoom -= 1;
        loadMapWithCurrentZoom();
      }
    }

    document.getElementById("displayId").innerText = "ID: " + idVal;
    document.getElementById("displayComune").innerText = comuneVal;

    if (localitaVal.trim() !== "") {
      document.getElementById("displayLocalita").innerText = localitaVal;
    } else {
      document.getElementById("displayLocalita").style.display = "none";
    }

    document
      .getElementById("zoomInButton")
      .addEventListener("click", increaseMapZoom);

    document
      .getElementById("zoomOutButton")
      .addEventListener("click", decreaseMapZoom);

    document
      .getElementById("closeButton")
      .addEventListener("click", function () {
        window.close();

        setTimeout(function () {
          window.history.back();
        }, 100);
      });

    loadMapWithCurrentZoom();

    try {
      window.history.replaceState(
        null,
        "",
        window.location.pathname
      );
    } catch (error) {
      console.warn("Impossibile rimuovere i parametri dall'URL.", error);
    }
  </script>
</body>
</html>
